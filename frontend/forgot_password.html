<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Lupa Password - Maduna</title>

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="forgot_password.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="brand-logo">
            <img src="assets/logo.png" alt="Logo Maduna" class="logo-img">
            <h2>Maduna</h2>
        </div>

        <h1>Lupa Password</h1>
        <p>Masukkan alamat email akun Anda. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi Anda.</p>

        <div id="alertBox" class="alert-box" style="display:none;"></div>

        <div class="form-group">
            <input type="email" id="email" placeholder="Masukkan Email Terdaftar" autocomplete="email" required>
        </div>

        <button id="sendBtn" class="btn-primary">
            <span>Kirim Link Reset</span>
        </button>

        <a href="login.html" class="back-link">
            <i class="bi bi-arrow-left"></i> Kembali ke Halaman Login
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="config.js"></script>
<script src="forgot_password.js"></script>

</body>
</html>
