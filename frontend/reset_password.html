<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reset Password - Maduna</title>

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="reset_password.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="brand-logo">
                <img src="assets/logo.png" alt="Logo Maduna" class="logo-img">
                <h2>Maduna</h2>
            </div>

            <h1>Reset Password Baru</h1>
            <p>Silakan masukkan kata sandi baru untuk akun Anda (minimal 8 karakter).</p>

            <div id="alertBox" class="alert-box" style="display:none;"></div>

            <div class="field password-field">
                <input type="password" id="password" placeholder="Password Baru (minimal 8 karakter)" autocomplete="new-password" required>
                <button type="button" class="btn-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <div class="field password-field">
                <input type="password" id="confirmPassword" placeholder="Konfirmasi Password Baru" autocomplete="new-password" required>
                <button type="button" class="btn-toggle" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Toggle password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <button id="resetBtn" class="btn-primary">
                Simpan Password Baru
            </button>

            <a href="login.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Kembali ke Halaman Login
            </a>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="config.js"></script>
<script src="reset_password.js"></script>

</body>
</html>
