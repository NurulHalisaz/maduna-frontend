<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Katalog Pelanggan | Maduna</title>
    
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="dashboard_customer.css">
</head>
<body>

    <!-- Navigasi Atas -->
    <nav class="navbar">
        <a href="dashboard_customer.html" class="nav-brand">🍯 MADUNA</a>
        <div class="nav-user">
            <!-- Tombol Keranjang -->
            <button class="btn-cart" onclick="toggleCart()">
                🛒 Keranjang (<span id="cartCount">0</span>)
            </button>
            <button class="btn-history" onclick="toggleHistory()">
                📦 Riwayat
            </button>
            <span id="userNameGreeting" style="display:none;">Halo, Pelanggan 👋</span>
            <button onclick="handleLogout()" class="btn-logout">Keluar</button>
        </div>
    </nav>

    <!-- Konten Utama Dashboard -->
    <main class="dashboard-wrapper">
        <header class="dashboard-header">
            <h1>Pilihan Paket Madu Murni</h1>
            <p>100% Madu Hutan Asli Pegunungan Latimojong langsung dari lebah liar Apis Dorsata.</p>
        </header>

        <!-- Area Kartu Produk (Di-render melalui JS) -->
        <section class="product-grid" id="productContainer">
            <!-- Skeleton Loading State -->
            <div class="product-card skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-text title"></div>
                <div class="skeleton-text desc"></div>
                <div class="skeleton-text price"></div>
            </div>
            <div class="product-card skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-text title"></div>
                <div class="skeleton-text desc"></div>
                <div class="skeleton-text price"></div>
            </div>
            <div class="product-card skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-text title"></div>
                <div class="skeleton-text desc"></div>
                <div class="skeleton-text price"></div>
            </div>
        </section>
    </main>

    <!-- Modal Keranjang Belanja -->
    <div id="cartModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Keranjang Belanja</h2>
                <span class="close-modal" onclick="toggleCart()">&times;</span>
            </div>
            <div id="cartItems" class="cart-items-container">
                <!-- Isi keranjang akan muncul di sini -->
            </div>
            <div class="cart-footer">
                <h3>Total: <span id="cartTotalPrice">Rp 0</span></h3>
                <button class="btn-checkout" onclick="checkoutWA()">Checkout via WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Modal Riwayat Pesanan -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 650px;">
            <div class="modal-header">
                <h2>Riwayat Pesanan Saya</h2>
                <span class="close-modal" onclick="toggleHistory()">&times;</span>
            </div>
            <div class="history-table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tanggal</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyItems">
                        <!-- Data riwayat pesanan dimuat via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js?v=1.1"></script>
    <script src="ux.js?v=1.1"></script>
    <script src="auth.js?v=1.1"></script>
    <script src="dashboard_customer.js?v=1.1"></script>
</body>
</html>
