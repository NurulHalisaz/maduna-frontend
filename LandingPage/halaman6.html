<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

.testimonial{

width:100%;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

gap:50px;

padding:40px min(5vw,60px);

flex-wrap:wrap;

font-family:Arial;

background:
linear-gradient(
rgba(255,255,255,.2),
rgba(255,255,255,.2)
),
url("assets/bg-maduna.jpeg");

background-size:cover;

background-position:center;

overflow-x:hidden;

}



/* KIRI */

.left{

position:relative;

width:min(60vw,620px);

aspect-ratio:1;

flex-shrink:0;

}



/* BUNDARAN */

.circle{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:100%;

height:100%;

border-radius:50%;

background:rgba(255,255,255,.65);

}



/* FOTO */

.people{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:100%;

height:100%;

}



/* JUDUL */

.title{

position:absolute;

left:50%;

top:52%;

transform:translate(-50%,-50%);

width:52%;

text-align:center;

font-size:clamp(28px,3vw,33px);

font-weight:700;

line-height:1;

color:#183A2A;

z-index:1;

pointer-events:none;

}



.title::after{

content:"Suara dari Pengguna Maduna";

display:block;

margin-top:10px;

font-size:clamp(11px,1vw,13px);

color:#A17C4B;

}



/* FOTO */

.person{

position:absolute;

width:clamp(80px,10vw,130px);

height:clamp(80px,10vw,130px);

border-radius:50%;

object-fit:cover;

cursor:pointer;

transform:translate(-50%,-50%);

z-index:10;

transition:
left .8s ease,
top .8s ease,
transform .5s ease;

}



.person.active{

transform:
translate(-50%,-50%)
scale(1.45);

z-index:50;

box-shadow:0 20px 50px rgba(0,0,0,.2);

}



/* KANAN */

.content{

flex:1;

min-width:280px;

max-width:500px;

}



/* TEKS */

#quote{

font-size:clamp(18px,2vw,30px);

line-height:1.8;

}



#name{

margin-top:40px;

font-size:clamp(28px,3vw,40px);

}



#role{

font-size:clamp(16px,2vw,24px);

color:#35693A;

}



/* MOBILE */

@media(max-width:768px){

.testimonial{

flex-direction:column;

padding:40px 20px;

min-height:auto;

}

.left{

width:min(90vw,380px);

}

.title{

width:70%;

font-size:clamp(24px,6vw,34px);

}

.title::after{

font-size:12px;

}

.person{

width:clamp(65px,18vw,110px);

height:clamp(65px,18vw,110px);

}

.person.active{

transform:
translate(-50%,-50%)
scale(1.3);

}

.content{

max-width:100%;

text-align:center;

}

#quote{

font-size:18px;

}

#name{

font-size:28px;

}

}



/* TABLET */

@media(min-width:769px) and (max-width:1100px){

.left{

width:min(55vw,500px);

}

}

</style>



<section class="testimonial">

<div class="left">

<div class="circle"></div>

<div class="people" id="people-container">
<!-- Elemen gambar avatar akan digenerate otomatis sesuai jumlah data dari database -->
</div>

<div class="title">

Testimonial

</div>

</div>



<div class="content">

<p id="quote"></p>

<h2 id="name"></h2>

<span id="role"></span>

</div>

</section>


<script>

const section = document.currentScript.previousElementSibling;

// Data awal (fallback jika database kosong atau sedang memuat)
let data = [
{
name: "Memuat Data...",
role: "Pengguna Maduna",
quote: "Sedang mengambil data komentar dari database..."
}
];

const quote = section.querySelector("#quote");
const name = section.querySelector("#name");
const role = section.querySelector("#role");
const peopleContainer = section.querySelector("#people-container");

let imgs = [];
let order = [];
let activeUser = 0;
let autoSlide;

// Fungsi untuk mengambil data komentar dari backend/database Supabase
async function fetchCommentsFromDB() {
    try {
        // Ganti URL ini dengan URL backend Vercel Anda yang aktif
        const response = await fetch('https://maduna-backend.vercel.app/api/comments');
        const result = await response.json();
        
        if (result && result.length > 0) {
            // Mapping data dari database (kolom 'name' dan 'content')
            data = result.map(item => ({
                name: item.name,
                role: "Pengguna Maduna",
                quote: item.content
            }));
        }
    } catch (error) {
        console.error("Gagal mengambil komentar dari database:", error);
    } finally {
        // Inisialisasi ulang elemen gambar avatar berdasarkan jumlah data yang didapat
        initTestimonialElements();
    }
}

function initTestimonialElements() {
    // Kosongkan container lalu buat tag img sejumlah data yang ada
    peopleContainer.innerHTML = "";
    
    data.forEach((_, index) => {
        const img = document.createElement("img");
        img.src = "./assets/avatar.jpg";
        img.className = "person";
        img.setAttribute("onclick", `moveToRight(${index})`);
        peopleContainer.appendChild(img);
    });

    imgs = section.querySelectorAll(".person");
    
    // Buat urutan indeks (0, 1, 2, dst)
    order = data.map((_, i) => i);
    
    render();
    restartAuto();
}

function getPositions(){
    const box = section.querySelector(".people");
    const size = box.offsetWidth;
    const center = size / 2;
    const radius = size * 0.38;
    
    // Generate posisi melingkar secara dinamis berdasarkan total data
    const total = data.length;
    let positions = [];
    for(let i = 0; i < total; i++) {
        const angle = (i * 2 * Math.PI) / total - Math.PI / 2;
        positions.push({
            x: center + radius * Math.cos(angle),
            y: center + radius * Math.sin(angle)
        });
    }
    return positions;
}

function render(){
    if (data.length === 0) return;
    
    const positions = getPositions();

    imgs.forEach((img, i) => {
        const p = positions[order[i]];
        if(p) {
            img.style.left = p.x + "px";
            img.style.top = p.y + "px";
        }
        img.classList.remove("active");
    });

    const active = order.indexOf(1);
    if(imgs[active]) {
        imgs[active].classList.add("active");
    }

    const activeDataIndex = order.findIndex(pos => pos === 1);
    const currentActive = activeDataIndex !== -1 ? activeDataIndex : 0;

    quote.innerHTML = "“" + data[currentActive].quote + "”";
    name.innerHTML = data[currentActive].name;
    role.innerHTML = data[currentActive].role;
}

window.moveToRight = function(index){
    activeUser = index;
    const posisi = order[index];
    const total = data.length;
    const geser = (1 - posisi + total) % total;
    
    order = order.map(v => (v + geser) % total);
    render();
    restartAuto();
}

function nextAuto(){
    activeUser = (activeUser + 1) % data.length;
    moveToRight(activeUser);
}

function restartAuto(){
    clearInterval(autoSlide);
    autoSlide = setInterval(nextAuto, 3000);
}

window.addEventListener("resize", () => {
    render();
});

// Jalankan pengambilan data saat halaman dimuat
document.addEventListener("DOMContentLoaded", () => {
    fetchCommentsFromDB();
});

// Fallback jika skrip dimuat setelah DOMContentLoaded
setTimeout(() => {
    if(imgs.length === 0) {
        fetchCommentsFromDB();
    }
}, 300);

</script>
